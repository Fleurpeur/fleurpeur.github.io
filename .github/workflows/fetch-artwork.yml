name: fetch-artwork

on:
  workflow_dispatch:
  push:
    branches:
      - claude/high-resolution-image-download-uyp1le

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: "https://www.staatsgalerie.de/de/sammlung-digital/schloss-und-gestuet-weil-bei-esslingen"
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
    steps:
      - uses: actions/checkout@v4

      - name: Static fetch diagnostics
        run: |
          curl -sSL -A "$UA" "$PAGE_URL" -o page.html || true
          wc -c page.html
          echo "==== raw page.html ===="
          cat page.html || true
          echo ""
          echo "==== end page.html ===="

      - name: Render page in headless Chrome and capture network requests
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@23 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          echo "chrome: $CHROME"
          export CHROME
          cat > capture.js <<'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setUserAgent(process.env.UA);
            await page.setViewport({width: 1600, height: 1000});
            const urls = new Set();
            page.on('request', r => urls.add(r.url()));
            try {
              await page.goto(process.env.PAGE_URL, {waitUntil: 'networkidle2', timeout: 90000});
            } catch (e) { console.error('goto:', e.message); }
            await new Promise(r => setTimeout(r, 6000));
            const cookieSels = ['button#onetrust-accept-btn-handler', 'button[data-testid*="accept" i]',
              'button[class*="accept" i]', 'button[class*="consent" i]', 'button[id*="accept" i]'];
            for (const sel of cookieSels) {
              try { await page.click(sel); console.log('clicked cookie:', sel);
                    await new Promise(r => setTimeout(r, 2000)); break; } catch (e) {}
            }
            const zoomSels = ['[aria-label*="zoom" i]', 'button[class*="zoom" i]', '[class*="zoom" i] button',
              '[data-testid*="zoom" i]', 'button[class*="fullscreen" i]', '[class*="detail-image" i]',
              'figure img', 'main img'];
            for (const sel of zoomSels) {
              try { await page.click(sel); console.log('clicked zoom:', sel);
                    await new Promise(r => setTimeout(r, 5000)); } catch (e) {}
            }
            // zoom in a few times to force high-res tile loads
            try {
              for (let i = 0; i < 5; i++) {
                await page.mouse.move(800, 500);
                await page.mouse.wheel({deltaY: -500});
                await new Promise(r => setTimeout(r, 1500));
              }
            } catch (e) {}
            await new Promise(r => setTimeout(r, 5000));
            fs.writeFileSync('rendered.html', await page.content());
            fs.writeFileSync('requests.txt', [...urls].join('\n'));
            await browser.close();
          })();
          EOF
          node capture.js || true
          echo "==== all captured requests ===="
          cat requests.txt || true
          echo "==== end requests ===="

      - name: Derive IIIF/image identifiers
        run: |
          sed 's/\\\//\//g' rendered.html > rendered_norm.html 2>/dev/null || touch rendered_norm.html
          grep -oE 'https?://[^"'"'"' <>\\]+' rendered_norm.html > html_urls.txt || true
          cat requests.txt html_urls.txt 2>/dev/null | sort -u > all_urls.txt
          echo "==== interesting URLs ===="
          grep -iE 'iiif|info\.json|default\.(jpe?g|png|webp)|tile|\.ptif|\.dzi|zoomify|download' all_urls.txt | tee interesting.txt || true
          python3 - <<'EOF'
          import re
          ids = set()
          for u in open('all_urls.txt'):
              u = u.strip()
              m = re.match(r'(.*)/[^/]+/[^/]+/[0-9!,.]+/default\.(?:jpe?g|png|webp|tif)', u)
              if m:
                  ids.add(m.group(1))
              if u.endswith('/info.json'):
                  ids.add(u[: -len('/info.json')])
          open('iiif_ids.txt', 'w').write('\n'.join(sorted(ids)) + '\n')
          print('IIIF base IDs found:')
          print('\n'.join(sorted(ids)) or '(none)')
          EOF

      - name: Download full resolution
        run: |
          set -x
          mkdir -p out
          DL=$(curl -s https://api.github.com/repos/lovasoa/dezoomify-rs/releases/latest | grep -oE '"browser_download_url": *"[^"]+linux[^"]*"' | grep -v musl | head -1 | grep -oE 'https[^"]+')
          curl -sSL "$DL" -o dz.tgz && tar xzf dz.tgz || true
          i=0
          while read -r ID; do
            [ -n "$ID" ] || continue
            i=$((i+1))
            echo "== candidate $i: $ID"
            curl -sSL -A "$UA" -H "Referer: $PAGE_URL" "$ID/info.json" -o "info_$i.json" || true
            head -c 600 "info_$i.json"; echo
            for size in "full/max" "full/full"; do
              if curl -fsSL -A "$UA" -H "Referer: $PAGE_URL" "$ID/$size/0/default.jpg" -o "out/direct_$i.jpg"; then
                echo "direct download ok: $ID/$size"
                break
              fi
            done
            if [ -x ./dezoomify-rs ]; then
              ./dezoomify-rs --largest --header "User-Agent: $UA" --header "Referer: $PAGE_URL" "$ID/info.json" "out/stitched_$i.jpg" || true
            fi
          done < iiif_ids.txt
          ls -la out/ || true
          for f in out/*; do
            [ -f "$f" ] && python3 -c "from PIL import Image; im=Image.open('$f'); print('$f', im.size)" 2>/dev/null || true
          done

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artwork-and-debug
          path: |
            out/
            rendered.html
            requests.txt
            all_urls.txt
            iiif_ids.txt
          if-no-files-found: warn

      - name: Commit best image to branch
        run: |
          set -x
          BEST=""
          BESTSIZE=0
          for f in out/*; do
            [ -f "$f" ] || continue
            S=$(stat -c%s "$f")
            if [ "$S" -gt "$BESTSIZE" ]; then BEST="$f"; BESTSIZE=$S; fi
          done
          echo "best: $BEST ($BESTSIZE bytes)"
          if [ -n "$BEST" ] && [ "$BESTSIZE" -gt 100000 ]; then
            mkdir -p artwork
            cp "$BEST" "artwork/steinkopf-schloss-und-gestuet-weil.jpg"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artwork/
            git commit -m "Add high-resolution artwork download [skip ci]" || echo "nothing to commit"
            git push
          else
            echo "No sufficiently large image obtained"; exit 1
          fi
