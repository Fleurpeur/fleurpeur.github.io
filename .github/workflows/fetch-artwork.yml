name: fetch-artwork

on:
  workflow_dispatch:
  push:
    branches:
      - claude/high-resolution-image-download-uyp1le

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: "https://www.emuseum.ch/de/objects/60821/zum-gluck-gibts-bier?ctx=05d22e4f38b846cde7ba990ebaf9fbee83b74402&idx=18"
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
    steps:
      - uses: actions/checkout@v4

      - name: Render page, open zoom viewer, capture all requests
        run: |
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@23 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          export CHROME
          cat > capture.js <<'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setUserAgent(process.env.UA);
            await page.setViewport({width: 1600, height: 1000});
            const urls = new Set();
            page.on('request', r => urls.add(r.url()));
            try {
              await page.goto(process.env.PAGE_URL, {waitUntil: 'networkidle2', timeout: 90000});
            } catch (e) { console.error('goto:', e.message); }
            await new Promise(r => setTimeout(r, 5000));
            for (const sel of ['button#onetrust-accept-btn-handler', 'button[class*="accept" i]',
                               'button[class*="consent" i]', 'a[class*="accept" i]']) {
              try { await page.click(sel); await new Promise(r => setTimeout(r, 1500)); break; } catch (e) {}
            }
            // dump clickable elements around the media area for diagnostics
            const clickables = await page.evaluate(() => {
              const out = [];
              document.querySelectorAll('a,button,[onclick],[class*="zoom" i],[class*="media" i] img').forEach(el => {
                const t = (el.className || '') + ' | ' + (el.getAttribute('href') || '') + ' | ' +
                          (el.getAttribute('title') || el.getAttribute('aria-label') || '') + ' | ' + el.tagName;
                if (/zoom|media|download|image|fullscreen|dispatcher/i.test(t)) out.push(t.slice(0, 300));
              });
              return out;
            });
            fs.writeFileSync('clickables.txt', clickables.join('\n'));
            // open the zoom overlay: emuseum uses an image link / zoom icon on the media
            const zoomSels = ['a[href*="zoom"]', '[class*="mediaZoom" i]', '[class*="media-zoom" i]',
                              'button[title*="oom"]', 'a[title*="oom"]', '.emuseum-detail-image a',
                              '[class*="detailMedia" i] a', 'figure a', 'main img'];
            for (const sel of zoomSels) {
              try { await page.click(sel); console.log('clicked:', sel);
                    await new Promise(r => setTimeout(r, 5000)); } catch (e) {}
            }
            try {
              for (let i = 0; i < 6; i++) {
                await page.mouse.move(800, 500);
                await page.mouse.wheel({deltaY: -600});
                await new Promise(r => setTimeout(r, 1200));
              }
            } catch (e) {}
            await new Promise(r => setTimeout(r, 4000));
            fs.writeFileSync('rendered.html', await page.content());
            fs.writeFileSync('requests.txt', [...urls].join('\n'));
            await browser.close();
          })();
          EOF
          node capture.js || true
          echo "==== ALL captured requests ===="
          cat requests.txt
          echo "==== clickable/zoom/download elements ===="
          cat clickables.txt || true
          echo "==== img/meta tags with media ===="
          grep -oE '<meta[^>]*image[^>]*>' rendered.html | head || true
          grep -oE '<img[^>]{0,400}>' rendered.html | head -30 || true

      - name: Try all known eMuseum resolution endpoints
        run: |
          set -x
          mkdir -p out
          {
            grep -oE 'https?://[^"'"'"' <>\\]+' rendered.html || true
            cat requests.txt || true
          } | sed 's/&amp;/\&/g' | sort -u > all_urls.txt
          grep -oE 'dispatcher/[0-9]+' all_urls.txt | grep -oE '[0-9]+' | sort -un > media_ids.txt
          cat media_ids.txt
          HOST="https://www.emuseum.ch"
          while read -r MID; do
            [ -n "$MID" ] || continue
            for VAR in "resolution=superImageResolution" "resolution=fullImageResolution" \
                       "resolution=largeImageResolution" "resolution=originalImageResolution" \
                       "resolution=superimageresolution" "preview" ""; do
              URL="$HOST/internal/media/dispatcher/$MID/$VAR"; URL="${URL%/}"
              SAFE=$(echo "$VAR" | tr -cd 'a-zA-Z'); OUTF="out/m${MID}_${SAFE:-bare}"
              curl -fsSL -A "$UA" -H "Referer: $PAGE_URL" "$URL" -o "$OUTF" || rm -f "$OUTF"
            done
            # download endpoint some instances expose
            curl -fsSL -A "$UA" -H "Referer: $PAGE_URL" "$HOST/internal/media/downloaddispatcher/$MID" -o "out/m${MID}_download" || rm -f "out/m${MID}_download"
          done < media_ids.txt
          # any deepzoom/iiif hints?
          grep -iE 'dzi|deepzoom|openseadragon|iiif|tile' all_urls.txt || echo "no deepzoom/iiif hints"
          ls -la out/ || true
          for f in out/*; do [ -f "$f" ] && file "$f"; done

      - name: Commit downloads to branch
        run: |
          set -x
          mkdir -p artwork/emuseum
          KEEP=0
          for f in out/*; do
            [ -f "$f" ] || continue
            [ "$(stat -c%s "$f")" -lt 20000 ] && continue
            case "$(file -b "$f")" in
              JPEG*) EXT=jpg;; PNG*) EXT=png;; TIFF*) EXT=tif;; *) continue;;
            esac
            cp "$f" "artwork/emuseum/$(basename "$f").$EXT"
            KEEP=$((KEEP+1))
          done
          ls -la artwork/emuseum/ || true
          if [ "$KEEP" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git add artwork/
            git commit -m "Add emuseum image variants [skip ci]" || echo "nothing to commit"
            git push
          else
            echo "No images obtained"; exit 1
          fi
